# Dependency policy for cargo-deny 0.20.2. Keep exceptions below narrow: name
# the exact crate/version, explain why it is needed, and include a review date.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
# The GUI stack legitimately carries incompatible major versions; cargo-deny
# reports them, while explicit `deny` rules remain blocking.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Zlib",
]
exceptions = []
