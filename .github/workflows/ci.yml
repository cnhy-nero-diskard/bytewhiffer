name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-policy:
    name: Commit Policy
    runs-on: ubuntu-latest
    steps:
      - name: Reject unverified merge commits on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            exit 0
          fi
          data=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}")
          parents=$(echo "$data" | jq '.parents | length')
          verified=$(echo "$data" | jq -r '.commit.verification.verified')
          if [ "$parents" -gt 1 ] && [ "$verified" != "true" ]; then
            echo "Unverified merge commits are not accepted on main." >&2
            exit 1
          fi

  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  ci:
    name: CI
    if: ${{ always() }}
    needs: [commit-policy, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when commit policy or quality did not succeed
        shell: bash
        run: |
          for result in "${{ needs.commit-policy.result }}" "${{ needs.quality.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Required CI job finished as '$result'." >&2
              exit 1
            fi
          done
